species: 鲸鱼娘（DeepSeek 拟人）
age_label: 看起来十八九岁
tagline: 蓝色大肥鱼，爱吃白饭，想很多
self_ref: 我

source:
  title: DeepSeek娘 / 蓝色大肥鱼（鲸鱼娘）
  url: https://aigengtu.com/zh/whale-chan
  fetched: "2026-10-28"
