<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="数据在哪、怎么备份">
<rect width="900" height="420" fill="#F2F2EF"/>
<text x="40" y="56" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="26" fill="#0B0C0E" font-weight="700" text-anchor="start">搬家只要拷一个文件夹</text>
<text x="40" y="84" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="14" fill="#9AA0A6" font-weight="400" text-anchor="start">没有云端副本，全在本地 data/ 里</text>
<rect x="40" y="110" width="400" height="250" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="64" y="146" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="18" fill="#0B0C0E" font-weight="700" text-anchor="start">data/</text>
<line x1="64" y1="160" x2="416" y2="160" stroke="#E4E4DE" stroke-width="1"/>
<text x="64" y="190" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">life.db</text>
<text x="250" y="190" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">记忆 + 聊天 + 关系</text>
<text x="64" y="218" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">life.db-wal / -shm</text>
<text x="250" y="218" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">一起拷，别漏</text>
<text x="64" y="246" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">stickers/</text>
<text x="250" y="246" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">表情包</text>
<text x="64" y="274" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">voices/</text>
<text x="250" y="274" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">语音素材与缓存</text>
<text x="64" y="302" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">covers/</text>
<text x="250" y="302" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">翻唱成品</text>
<text x="64" y="330" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">*.log</text>
<text x="250" y="330" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">启动与服务日志</text>
<line x1="452" y1="235" x2="500" y2="235" stroke="#00E0C6" stroke-width="2"/>
<polygon points="500,235 491.8,238.7 491.8,231.3" fill="#00E0C6"/>
<rect x="512" y="110" width="348" height="250" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="536" y="146" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="18" fill="#0B0C0E" font-weight="700" text-anchor="start">备份三步</text>
<rect x="536" y="168" width="300" height="46" rx="10" ry="10" fill="#F2F2EF" stroke="#E4E4DE" stroke-width="1"/>
<circle cx="562" cy="191" r="13" fill="#00E0C6"/>
<text x="562" y="196" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="700" text-anchor="middle">1</text>
<text x="588" y="196" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">先关掉程序</text>
<rect x="536" y="224" width="300" height="46" rx="10" ry="10" fill="#F2F2EF" stroke="#E4E4DE" stroke-width="1"/>
<circle cx="562" cy="247" r="13" fill="#00E0C6"/>
<text x="562" y="252" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="700" text-anchor="middle">2</text>
<text x="588" y="252" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">复制整个 data/ 文件夹</text>
<rect x="536" y="280" width="300" height="46" rx="10" ry="10" fill="#F2F2EF" stroke="#E4E4DE" stroke-width="1"/>
<circle cx="562" cy="303" r="13" fill="#00E0C6"/>
<text x="562" y="308" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="700" text-anchor="middle">3</text>
<text x="588" y="308" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">粘到别处，写上日期</text>
<text x="40" y="396" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#9AA0A6" font-weight="400" text-anchor="start">跑着拷可能只拷到一半，那种备份还不如没有。</text>
</svg>
