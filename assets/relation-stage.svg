<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="关系四维与六个阶段">
<rect width="900" height="440" fill="#F2F2EF"/>
<text x="40" y="56" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="26" fill="#0B0C0E" font-weight="700" text-anchor="start">关系是算出来的，不是模型随口说的</text>
<text x="40" y="84" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="14" fill="#9AA0A6" font-weight="400" text-anchor="start">四个数 + 六个阶段，一段关系里只认一个恋人</text>
<rect x="40" y="110" width="190" height="84" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="60" y="144" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="18" fill="#0B0C0E" font-weight="700" text-anchor="start">好感</text>
<text x="60" y="170" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">想不想理你</text>
<rect x="250" y="110" width="190" height="84" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="270" y="144" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="18" fill="#0B0C0E" font-weight="700" text-anchor="start">信任</text>
<text x="270" y="170" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">敢不敢说真话</text>
<rect x="460" y="110" width="190" height="84" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="480" y="144" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="18" fill="#0B0C0E" font-weight="700" text-anchor="start">吸引</text>
<text x="480" y="170" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">想不想靠近</text>
<rect x="670" y="110" width="190" height="84" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="690" y="144" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="18" fill="#0B0C0E" font-weight="700" text-anchor="start">反感</text>
<text x="690" y="170" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#9AA0A6" font-weight="400" text-anchor="start">这条线碰不得</text>
<rect x="40" y="236" width="120" height="56" rx="10" ry="10" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="100.0" y="270" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="15" fill="#0B0C0E" font-weight="700" text-anchor="middle">陌生</text>
<line x1="162" y1="264" x2="178" y2="264" stroke="#9AA0A6" stroke-width="2"/>
<polygon points="178,264 169.8,267.7 169.8,260.3" fill="#9AA0A6"/>
<rect x="180" y="236" width="120" height="56" rx="10" ry="10" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="240.0" y="270" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="15" fill="#0B0C0E" font-weight="700" text-anchor="middle">眼熟</text>
<line x1="302" y1="264" x2="318" y2="264" stroke="#9AA0A6" stroke-width="2"/>
<polygon points="318,264 309.8,267.7 309.8,260.3" fill="#9AA0A6"/>
<rect x="320" y="236" width="120" height="56" rx="10" ry="10" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="380.0" y="270" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="15" fill="#0B0C0E" font-weight="700" text-anchor="middle">熟人</text>
<line x1="442" y1="264" x2="458" y2="264" stroke="#9AA0A6" stroke-width="2"/>
<polygon points="458,264 449.8,267.7 449.8,260.3" fill="#9AA0A6"/>
<rect x="460" y="236" width="120" height="56" rx="10" ry="10" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="520.0" y="270" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="15" fill="#0B0C0E" font-weight="700" text-anchor="middle">亲近</text>
<line x1="582" y1="264" x2="598" y2="264" stroke="#9AA0A6" stroke-width="2"/>
<polygon points="598,264 589.8,267.7 589.8,260.3" fill="#9AA0A6"/>
<rect x="600" y="236" width="120" height="56" rx="10" ry="10" fill="#FFFFFF" stroke="#E4E4DE" stroke-width="1"/>
<text x="660.0" y="270" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="15" fill="#0B0C0E" font-weight="700" text-anchor="middle">暧昧</text>
<line x1="722" y1="264" x2="738" y2="264" stroke="#9AA0A6" stroke-width="2"/>
<polygon points="738,264 729.8,267.7 729.8,260.3" fill="#9AA0A6"/>
<rect x="740" y="236" width="120" height="56" rx="10" ry="10" fill="#00E0C6" stroke="#E4E4DE" stroke-width="1"/>
<text x="800.0" y="270" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="15" fill="#0B0C0E" font-weight="700" text-anchor="middle">恋人</text>
<text x="40" y="340" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#6B7178" font-weight="400" text-anchor="start">只往前走，不来回横跳。吵完架会退半步，但不会退回陌生人。</text>
<rect x="40" y="362" width="820" height="46" rx="10" ry="10" fill="#F2F2EF" stroke="#E4E4DE" stroke-width="1"/>
<text x="60" y="391" font-family="'Microsoft YaHei UI','PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="13" fill="#0B0C0E" font-weight="400" text-anchor="start">表白、分手、吃醋、和好 —— 都有写死的规矩兜底，不让模型随口编。</text>
</svg>
